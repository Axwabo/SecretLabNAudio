name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  id-token: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: Axwabo/scpsl-references-downloader@v1

      - name: Build
        run: dotnet build -c Release -o Out

      - name: Create Bundle
        working-directory: Out
        run: ${{ github.workspace }}/bundle.sh

      - name: Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: Out/SecretLabNAudio*.dll,Out/SecretLabNAudio*.xml,Out/SecretLabNAudio.zip
          
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        working-directory: Out
        run: dotnet nuget push SecretLabNAudio.*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
